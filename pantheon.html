<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>The Pantheon – Mirandel</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
/* Same palette as the Markets page: parchment, Alegreya. */
:root{--bg:#f6f1e7;--panel:#f4ead5;--fg:#2b2118;--cd:#fffaf0;--ac:#7a4a1d;--mu:#6b5d4d;--bd:#d9ccb4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1713;--panel:#2a251c;--fg:#eadfcb;--cd:#26201a;--ac:#d9a45b;--mu:#a39683;--bd:#3d3328}}
*{box-sizing:border-box}body{margin:0;background:#1b1a17 url(assets/bg-forest.jpg) center/cover fixed;color:var(--fg);font:14px/1.5 'Alegreya',Georgia,serif}
body::before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(20,18,14,.55),rgba(20,18,14,.72));pointer-events:none;z-index:0}
header{padding:0;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg);z-index:5}
#topbar{display:flex;gap:2px;align-items:center;padding:calc(6px + env(safe-area-inset-top,0px)) 12px 6px;background:var(--panel);border-bottom:1px solid var(--bd);font-size:14px;overflow-x:auto}
#topbar a{color:var(--fg);text-decoration:none;padding:4px 10px;border-radius:6px;white-space:nowrap}
#topbar a:hover{text-decoration:underline}
#topbar a.on{background:var(--ac);color:var(--panel)}
#topbar .brand{font-weight:700;color:var(--ac);font-size:16px}
#topbar .brand.on{color:var(--panel)}
h1{font-size:18px;margin:0;color:var(--ac);padding:10px 14px}
h1 span{font-size:14px;color:var(--mu);font-weight:400}
main{padding:12px;max-width:880px;margin:0 auto;position:relative;z-index:1}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:6px;padding:12px 14px;margin-bottom:10px}
.card h2{margin:0 0 6px;font-size:17px;color:var(--ac)}
table{width:100%;border-collapse:collapse}th,td{padding:5px 8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}th{color:var(--ac);font-size:13px}td:first-child{font-weight:700;white-space:nowrap}
</style></head><body>
<header><nav id="topbar"><a class="brand" href="index.html">Mirandel</a><a href="world.html">World Map</a><a href="markets.html">Markets</a><a href="npcs.html">NPCs</a><a class="on" href="pantheon.html">Pantheon</a><a href="recaps.html">Recaps</a></nav><h1>The Pantheon <span>Sixteen gods</span></h1></header>
<main id="list"></main>
<script>
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// ---- EDIT HERE: gods -----------------------------------------------------
// One line per god: [name, domain, alignment].
// Domain is the "God of ..." from the Campaign Setting doc, kept word for
// word. The page sorts the list alphabetically. Do NOT add faction info
// here: which side a god is on is a spoiler for the players.
const GODS=[
["Caedes","God of Murder","Neutral Evil / Chaotic Evil"],
["Custos","God of Tradition","Lawful Neutral / Lawful Evil"],
["Devotum","God of Duty","Lawful Good / Lawful Neutral"],
["Dysmion","God of Chaos","Chaotic Neutral"],
["Ealdor","God of Justice and Protection","Lawful Good"],
["Entropy","God of Ruin","Chaotic Neutral / Chaotic Evil"],
["Lumina","Goddess of Light and Hope","Lawful Good / Neutral Good"],
["Malacor","God of Tyranny and Subjugation","Lawful Evil"],
["Morwen","Goddess of Death and Decay","Neutral Evil"],
["Occisor","God of Slaughter","Chaotic Evil"],
["Oramis","God of Order","Lawful Neutral"],
["Persana","Goddess of Seas and Freedom","Neutral Good"],
["Selyne","Goddess of Mercy and Healing","Neutral Good"],
["Solas","God of Art and Inspiration","Chaotic Good"],
["Syl","God of Winds and Travel","Chaotic Good / Chaotic Neutral"],
["Umbra","Goddess of Secrets","Lawful Evil / Neutral Evil"]
];
$('list').innerHTML=`<div class=card><table><tr><th>God<th>Domain<th>Alignment</tr>${GODS.slice().sort((a,b)=>a[0].localeCompare(b[0])).map(g=>`<tr><td>${esc(g[0])}<td>${esc(g[1])}<td>${esc(g[2])}</tr>`).join('')}</table></div>`;
</script></body></html>
