<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mirandel – Interactive Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1a17;--panel:#f4ead5;--ink:#2b2216;--accent:#7a4b1e;--rule:#c9b48a;--route:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:#2a251c;--ink:#efe4cc;--accent:#e0b06a;--rule:#4a4130;--route:#ff6b57}}
:root[data-theme="dark"]{--panel:#2a251c;--ink:#efe4cc;--accent:#e0b06a;--rule:#4a4130;--route:#ff6b57}
html,body{height:100%;margin:0;background:var(--bg);font-family:'Alegreya',Georgia,"Times New Roman",serif;overflow:hidden;color:var(--ink)}
/* EDIT: map backdrop, trial: forest photo behind the map. Remove the url() to go back to plain dark. */
#view{position:absolute;top:calc(42px + env(safe-area-inset-top,0px));right:0;bottom:0;left:0;touch-action:none;cursor:grab;overflow:hidden;background:linear-gradient(rgba(20,18,14,.5),rgba(20,18,14,.6)),#1b1a17 url(assets/bg-forest.jpg) center/cover}
#view.plot{cursor:crosshair}
#world{position:absolute;left:0;top:0;transform-origin:0 0;--inv:1}
#world img{display:block;user-select:none;-webkit-user-drag:none}
#route{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.pin{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:3px solid #ffd36b;box-shadow:0 0 0 1.5px #2b2216,0 0 7px #000;cursor:pointer;transform:scale(var(--inv));box-sizing:border-box}
.pin.region{width:18px;height:18px;margin:-9px 0 0 -9px;border:2px dashed #fff;background:rgba(255,211,107,.55)}
.pin:hover,.pin.on{background:rgba(255,211,107,.45);z-index:5}
.pin::after{content:attr(data-n);position:absolute;left:50%;bottom:125%;transform:translateX(-50%);background:var(--panel);color:var(--ink);padding:2px 7px;border-radius:4px;font-size:13px;white-space:nowrap;opacity:0;pointer-events:none;border:1px solid var(--rule)}
.pin:hover::after{opacity:1}
.wp{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:var(--route);color:#fff;font:700 11px/20px 'Alegreya',Georgia,serif;text-align:center;border:2px solid #fff;box-shadow:0 0 4px #000;transform:scale(var(--inv));pointer-events:none;box-sizing:content-box}
.ui{position:absolute;background:var(--panel);border:1px solid var(--rule);border-radius:8px;box-shadow:0 3px 14px rgba(0,0,0,.45)}
#tools{left:12px;top:calc(54px + env(safe-area-inset-top,0px));display:flex;gap:6px;padding:6px}
button{font:inherit;font-size:14px;background:transparent;color:var(--ink);border:1px solid var(--rule);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.active{background:var(--accent);color:var(--panel);border-color:var(--accent)}
#rp{left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:300px;padding:10px 12px;display:none;font-size:14px}
#rp h3{margin:0 0 4px;font-size:16px;color:var(--accent)}
#rp p{margin:4px 0;font-size:13px;opacity:.85}
#rp table{width:100%;border-collapse:collapse;margin:6px 0}
#rp td{padding:3px 0;border-top:1px solid var(--rule)}
#rp td:last-child{text-align:right;font-weight:700}
#rp .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#rp input{width:70px;font:inherit;background:transparent;color:var(--ink);border:1px solid var(--rule);border-radius:4px;padding:2px 4px}
#cards{position:absolute;right:12px;top:calc(54px + env(safe-area-inset-top,0px));width:320px;max-height:calc(100% - 66px);overflow:auto;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.card{pointer-events:auto;position:relative;padding:12px 14px}
.card h2{margin:0 26px 0 0;font-size:19px;color:var(--accent)}
.card small{display:block;margin:0 0 6px;font-style:italic;opacity:.7}
.card p{margin:0;font-size:14.5px;line-height:1.5}
.card .x{position:absolute;right:8px;top:8px;padding:0 8px;font-size:18px;line-height:24px}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom,0px));font-size:12px;color:#d8cba8;background:rgba(0,0,0,.45);padding:3px 10px;border-radius:10px;pointer-events:none;white-space:nowrap}
@media(max-width:640px){#cards{left:8px;right:8px;top:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px));width:auto;max-height:45%}#rp{left:8px;right:8px;width:auto;bottom:auto;top:calc(102px + env(safe-area-inset-top,0px))}#hint{display:none}}
.citylink{display:inline-block;margin:10px 6px 0 0;padding:5px 12px;border:1px solid var(--accent);border-radius:6px;color:var(--accent);text-decoration:none;font-size:14px}
.citylink:hover{background:var(--accent);color:var(--panel)}

#topbar{position:absolute;top:0;left:0;right:0;height:calc(42px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:2px;padding-left:10px;padding-right:10px;background:var(--panel);border-bottom:1px solid var(--rule);font-size:14px;box-sizing:border-box;overflow-x:auto}
#topbar a{color:var(--ink);text-decoration:none;padding:4px 10px;border-radius:6px;white-space:nowrap}
#topbar a:hover{text-decoration:underline}
#topbar a.on{background:var(--accent);color:var(--panel)}
#topbar .brand{font-weight:700;color:var(--accent);font-size:16px}
#topbar .brand.on{color:var(--panel)}
</style></head><body>

var PLACES=[
["The Divine Gate & The Winterhelms",300,45,"Landmark","High in the frozen, impassable peaks of the northwest lies the Divine Gate. It is a physical and metaphysical barrier sealing the gods from the mortal plane, built as part of the truce that ended the Great Schism. The Gate was primarily designed by Oramis, God of Order, to ensure the gods do not break their truce."],
["The Deepswamp",620,640,"Region","The deepswamp is an ancient and dangerous place. Here, the Tree of Life, a massive primordial tree, older than the Gods, sits. The deepswamp is the closest metaphysical location in Mirandel to the other planes, and those with strong connections to them will feel it more closely here. It is dangerous and magical."],
["The Golden Fields",1010,300,"Region","The Golden Fields are a broad stretch of farmland and open plain in the north of Mirandel, running from the foothills of the Winterhelms down to the river lands above Plinth Bay. The Kingdom of Plinth’s breadbasket towns sit in the Fields, and their grain feeds much of the continent. Plinth guards the Fields closely, and Amox begrudgingly depends on them."],
["The Maw",280,1390,"Landmark","A terrifying, massive whirlpool to the southwest of the main continent. Sailors avoid it at all costs, hugging the shoreline, as its sheer size will start to pull you in before you even know you’re too close. It is so large, someone on the edge will not even notice they’ve crossed the point of no return."],
["The Purelake",430,490,"Region","A massive lake in the northwest of Mirandel. Despite primarily being fed by glacial runoff from the Winterhelms, its shallow depth means it is warm by comparison to other bodies of water. Despite the sheer size, it is, at most, thigh deep for a human."],
["The Tan Mountains",1105,1085,"Region","A rugged mountain range acting as a natural barrier protecting The Reach from the magical radiation and horrors of The Wastes."],
["The Wastes",930,1440,"Region","This entire southwestern desert was once lush land, flash-fried into a desolate wasteland when the Gods clashed during the Quarrel over Time’s departure."],
["Fortune’s Bay",1960,1010,"Water","Fortune’s Bay is a wide bay on the east coast of Mirandel, opening onto the Azure Ocean. The towns of Listeria’s lower coast, Tressel, Starlight, and Beacon, sit on its northern shore. The bay gives the Republic of Amox easy sea access to that coast, which is why Listeria’s navy watches it closely."],
["The Azure Ocean",2080,420,"Water","The Azure Ocean is the great ocean east of Mirandel. The coasts of Amox, Cedarcrest, and the Free Cities all face it, and most of the world’s sea trade crosses it. The Amox Strait is its only connection to the Northern Sea."],
["The Northern Sea",1500,120,"Water","The Northern Sea is the cold sea north of Mirandel, between the mainland and the island of the Free Cities. Bywater and the shore towns sit on its western coast, and the Amox Strait connects it to the Azure Ocean at its eastern end."],
["The Amox Strait",1715,455,"Water","The Amox Strait is the narrow channel between the Northern Sea and the Azure Ocean, and the only sea route connecting them. The Republic of Amox controls the strait and levies a toll on every vessel that passes through it, which is the largest source of the Republic’s wealth."],
["Plinth Bay",835,1000,"Water","Plinth Bay is a large bay in the southwest of Mirandel. The city of Plinth sits at its head, where the river meets the bay, and Rebury sits on its western shore. Most trade between Plinth, Rebury, and Kedar moves across the bay."],
["The Everwoods",1660,985,"Region","The Everwoods are a vast, old forest east of Plinth and south of Amox, stretching down toward Listeria. The elven city of Everlight is hidden within them, and the elves do not welcome uninvited guests beneath the trees. The forest is the reason Listeria has such a high population of elves and half-elves."],
["Everlight",1490,925,"City","Everlight is the elven city within the Everwoods. Few outsiders have ever seen it, and the elves of Everlight keep their own counsel, apart from the kingdoms of men. Many of the elves and half-elves of Listeria trace their roots to Everlight."],
["Plinth",1035,905,"City","Plinth is the capital of the Kingdom of Plinth, a massive city situated at the central choke point of the continent, where the rivers meet Plinth Bay. It is a jewel of Mirandel, and a hub of commerce, diplomacy, and scholarship. The Reaching Road gives Plinth easier access to the breadbasket towns of the Golden Fields than its rival Amox, and agricultural trade flows through the city, giving the Kingdom leverage over Amox’s food supply. Plinth is a rival kingdom to Amox, the other major city on the River Ealdor."],
["Amox",1618,540,"City","Amox is a heavily fortified city, and the capital of the Republic of Amox, that controls naval trade between the Northern Sea and the Azure Ocean. About 200,000 people live inside its walls, and most of them live in the Warrens. The rulers of Amox, the Patriars, are incredibly wealthy, levying tolls on all ships passing through the strait, oft causing tensions with rival Kingdom Plinth. The city is aggressively capitalist, with an enormous wealth gap between the rich Patriars and the smallfolk. The population is heavily human, with a spattering of other races."],
["Listeria",1650,1068,"City","Listeria is the second largest city in the Kingdom of Plinth, and is only so begrudgingly. There is oft political tension between Plinth and Listeria, as the people of Listeria still see themselves as an independent city-state. The city has a higher-than-normal population of elves and half-elves, due to the proximity to the Everwoods and Everlight, the elven city. Listeria is one of the most tolerant cities in the world at-large, and is a bastion of adventurers, scholars, and anyone else seeking glory."],
["Rebury",360,965,"City","Rebury is the largest city of the Rebury Region, sitting on the Southern coast, North of the Maw, where the river meets the sea. What trade still moves in the region passes through Rebury, on guarded ships and barges bound for Plinth. The city lives in the shadow of Mico’s fall to the west, and its people are careful on the roads after dark, even as far as they are from the fallen town."],
["Cedarcrest",2040,628,"City","Cedarcrest is the largest city of the Republic of Amox’s eastern arm, a port on the Azure Ocean coast south of Homeward. Cedar timber and shipbuilding are its main trades, and its harbor is the Republic’s main port on the ocean itself. It is a wealthy city, though it lives in Amox’s shadow."],
["Freetown",1790,360,"City","Freetown is the largest city of the Free Cities’ Alliance, a port on the strait coast of the northern island, facing Amox across the water. It is a free port, and no tolls are levied on ships that dock there, which draws trade from captains who resent paying Amox for passage. The city guards its independence closely, like all the Free Cities."],
["Xanthas",1100,1305,"City","Xanthas is a city in the heart of the Wastes, south of the Tan Mountains. It survives on deep wells and the caravan trade with Kedar, in a land scorched by the Quarrel and still touched by wild magic. Its people are hardened and self-reliant, and they have to be."],
["Veron",2020,205,"City","Veron is a city of the Free Cities’ Alliance on the east coast of the northern island, facing the Azure Ocean. It is a lawless area, a haven for pirates and thieves. While a code exists between those that choose to test their luck at piracy, the code is really more of…guidelines…rather than rules."],
["Bywater",1305,148,"Town","Bywater is a port town on the north coast of the Republic of Amox, on the shore of the Northern Sea. Fishing and coastal trade are its livelihood, and ships cross from here to the Free Cities. The Eastern Road runs south from Bywater through Thistlepeak and Edgewood."],
["Thistlepeak",1177,218,"Town","Thistlepeak is one of the Republic of Amox’s grain and timber towns, with a population of around 15,000 spread across the hills and farms around it. It sits on the Eastern Road between Bywater and Edgewood, at the foot of the thistle-covered “peak” (more of a hill) it is named for. The country around it is cooler and rougher than the lowlands."],
["Edgewood",1357,382,"Town","Edgewood is one of the Republic of Amox’s main timber towns, with a population of around 40,000. The Eastern Road runs through the town, and the stretch of road near Edgewood is a common target for goblin and bandit raids, as the dense Arid Woods line the road on both sides."],
["Ferry Falls",1485,580,"Town","Ferry Falls is one of the Republic of Amox’s main grain towns, with a population of around 30,000 spread widely across the surrounding landscape. It sits on the river west of Amox, and takes its name from the falls and the ferry crossing below them. Goods from the town move along the river and the roads toward Amox and Plinth."],
["Drear",1778,632,"Town","Drear is a small town on the eastern road between Amox and Cedarcrest. It is a gray, windswept place of farms and grazing land, and most travelers ignore it on their way somewhere else. Its people are used to being overlooked, and mostly prefer it that way."],
["Homeward",1962,520,"Town","Homeward is a coastal town on the road between Amox and Cedarcrest, facing the Azure Ocean. It takes its name from homeward bound ships, which often port here before the final stretch west to Amox. It is a town of inns, warehouses, and sailors waiting on weather."],
["Klift",1890,727,"Town","Klift is a small town on the cliffs south of Cedarcrest, the southernmost settlement of the Republic of Amox on the Azure Ocean coast. Fishing boats work from the harbor below the cliffs, and the road north to Cedarcrest is the town’s only real connection to the wider world."],
["Bolmore",748,240,"Town","Bolmore is a market town at the northern edge of the Golden Fields, on the road between Wintershore and Windward. Dwarven goods coming down from the Winterhelms are traded here for grain and foodstuffs from the Fields. It is the first stop for travelers heading south from the mountains."],
["Windward",889,372,"Town","Windward is a breadbasket town at the northern edge of the Golden Fields, where the wind comes down off the Winterhelms. Like the other breadbasket towns, it is an agricultural town of simple folk who are paid well by Plinth and keep to themselves. Its people care little for the politics of the big cities."],
["Amberfield",1034,392,"Town","Amberfield is a breadbasket town in the western Golden Fields, south of Windward. Its farms produce grain for the Kingdom of Plinth, and agricultural trade from the town flows through Plinth by the Reaching Road. The people keep a small world focus, and are content under Plinth’s protection."],
["Keeland",1136,430,"Town","Keeland is a breadbasket town at a crossroads in the center of the Golden Fields, where the roads from Bywater, Thistlepeak, Bolmore, and Windward meet. Grain from the surrounding farms is gathered here before it moves south to Plinth. It sees more through traffic than any other breadbasket town."],
["Fielding",1160,550,"Town","Fielding is a breadbasket town in the southern Golden Fields, below Keeland. It is an agricultural town like its neighbors, growing grain for Plinth on the flat land along the river plain. Some in the town have begun to think the people have grown too comfortable under the boot of Plinth."],
["Greenbarrow",1097,620,"Town","Greenbarrow is a timber town in the southwest of the Golden Fields, near the river that flows down to Plinth. It takes its name from the old grass-covered barrows at the edge of the fields that sit opposite the small but dense woods to the east. The town is content, quiet, and loyal enough to Plinth, which pays well for its lumber."],
["The Green Crossroads",1510,1140,"Town","The Green Crossroads is a medium settlement at the beginning of the High Road that connects Plinth to its vassal cities and towns in the southeast of the continent. It is a town of humans and gnomes, who are generally friendly with each other, though mostly keep to themselves due to the differing cultures."],
["Tressel",1727,1203,"Town","Tressel is a quiet agricultural town on the lower coast of Fortune’s Bay. It was originally a vassal town of Listeria before it was conquered by Plinth, and its people still see themselves as Listerians rather than Plinthans. Most of its produce moves by road to Listeria and on to Plinth."],
["Starlight",1888,1250,"Town","Starlight is a quiet agricultural town east of Tressel, on the lower coast of Fortune’s Bay. Like Tressel, it was a vassal of Listeria before Plinth conquered it, and its people still consider themselves Listerian. It is the smallest and quietest of the three bay towns."],
["Beacon",2040,1145,"Town","Beacon is a robust maritime fishing village on the point at the mouth of Fortune’s Bay, named for the beacon kept lit there for ships entering the bay. It was a vassal town of Listeria before Plinth conquered the coast, and it is well guarded by the navy of Listeria, as Fortune’s Bay allows the Republic of Amox easy access to the towns on the lower coast."],
["Stoneward",1470,1282,"Town","Stoneward is a town on the road north of Hearthstone, at the edge of Plinth’s hill country in the southeast. Its people share the culture of the southern hills, isolated and ancestral, and they are known for stargazing, charting the stars to measure time. The town pays tribute to Plinth and is otherwise left to its own ways."],
["Hearthstone",1668,1372,"Town","Hearthstone is a town in the rugged southeast of the Kingdom of Plinth, known for its terraced farms cut into the hillsides. Its people are resilient and culturally isolated, focused on ancestral worship, and they pay tribute to Plinth while keeping their relative independence. The Kingdom recognizes the cultural divide and does not impede on it."],
["Greenrun",30,855,"Town","Greenrun is a small town at the western edge of the Rebury Region, where the coast road turns inland toward Mico. It is a farming town, and it has grown quiet and wary over the years since word of Mico’s fall spread through the region."],
["Mico",45,540,"Town","Mico is a town of around 25,000 people in western Rebury. For decades the town was harried by a powerful group of vampires led by the ruthless Miraslav von Krovich, and around 6 years ago it fell to them entirely. Today Mico exists as an enslaved feeding farm, its surviving population subjugated and harvested as livestock under von Krovich’s court. What trade remains moves on guarded ships and barges through Rebury toward Plinth."],
["Riverwood",122,975,"Town","Riverwood is a small fishing town west of Rebury, sat on the northern coast of the Maw. It is the primary fishing town in the Rebury region, and a waystop for people travelling away from Mico. It is a quiet place, and most news from the wider world reaches it late."],
["Frostreach",318,290,"Town","Frostreach is the westernmost of the Dwarven Kingdoms, a stronghold in the high snows of the Winterhelms. It is a cold, remote place, and its dwarves are more isolated than most of their kin. The road east through Stonegap is its main link to the rest of the world."],
["Stonegap",447,165,"Town","Stonegap is a dwarven fortress town built into the pass through the western Winterhelms, which it is named for. All road traffic between the dwarven lands and the south passes through the Gap, and the dwarves guard it closely. Little grows there, and the town lives on tolls, trade, and the strength of its walls."],
["Wintershore",660,150,"Town","Wintershore is a dwarven town on the shore below the Winterhelms, where the mountain road comes down to the water. Goods from the Dwarven Kingdoms are traded here and carried south to Bolmore and the Golden Fields. It is the most outward looking of the dwarven towns, used to dealing with the lowland peoples."],
["Xandar",1773,208,"Town","Xandar is an inland town of the Free Cities’ Alliance, at the crossroads of the northern island, where the roads to Freetown, Veron, and Last Respite meet. It is a market town, and most of the island’s overland trade passes through it. What it lacks in a harbor it makes up for in location."],
["Roadway",1830,133,"Town","Roadway is a small inland town on the northern island of the Free Cities, built along the road between Xandar and Last Respite. It exists to serve that road, with inns, stables, and wagonwrights for travelers crossing the island."],
["Last Respite",1897,62,"Town","Last Respite is the northernmost town in Mirandel, at the far tip of the island of the Free Cities. It is the last port of call for ships crossing the Northern Sea, and its name is literal. Little reaches it except by the road from Roadway or by sea."],
["Ghilt",1970,318,"Town","Ghilt is a small port on the east coast of the northern island, south of Veron. It is known for its goldsmiths and the gilt work that gives the town its name, which is traded across the Azure Ocean. Like the other Free Cities, it answers to no king or republic."],
["Kedar",713,1197,"Town","Kedar is a port town on the coast at the western edge of the Wastes, where the road east into the desert begins. Caravans gather here before crossing to Xanthas, and the town’s wells and warehouses are stocked for the crossing. It is the last reliable water on the western side of the Wastes."]
];

view.addEventListener("pointermove",function(e){var p=ptr[e.pointerId];if(!p)return;var ids=Object.keys(ptr);
 if(ids.length===1){var dx=e.clientX-p.x,dy=e.clientY-p.y;if(!moved&&Math.hypot(e.clientX-startXY[0],e.clientY-startXY[1])>6){moved=true;try{view.setPointerCapture(e.pointerId)}catch(x){}}if(moved){T.x+=dx;T.y+=dy;apply()}p.x=e.clientX;p.y=e.clientY}
 else if(ids.length===2){moved=true;var o=ptr[ids.find(function(k){return k!=e.pointerId})];var d0=Math.hypot(p.x-o.x,p.y-o.y);p.x=e.clientX;p.y=e.clientY;var d1=Math.hypot(p.x-o.x,p.y-o.y);if(d0>0){var r=view.getBoundingClientRect();zoomAt((p.x+o.x)/2-r.left,(p.y+o.y)/2-r.top,d1/d0)}}});
