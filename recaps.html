<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Session Recaps – Mirandel</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
/* Same palette as the Markets page: parchment, Alegreya. */
:root{--bg:#f6f1e7;--fg:#2b2118;--cd:#fffaf0;--ac:#7a4a1d;--mu:#6b5d4d;--bd:#d9ccb4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1713;--fg:#eadfcb;--cd:#26201a;--ac:#d9a45b;--mu:#a39683;--bd:#3d3328}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 'Alegreya',Georgia,serif}
header{padding:10px 14px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg);z-index:5}
#topbar{display:flex;gap:2px;align-items:center;flex-wrap:wrap;padding:2px 0 8px;border-bottom:1px solid var(--bd);margin-bottom:8px}
#topbar a{color:var(--fg);text-decoration:none;padding:3px 9px;border-radius:4px}
#topbar a:hover{text-decoration:underline}
#topbar a.on{background:var(--ac);color:var(--bg)}
#topbar .brand{font-weight:700;color:var(--ac)}
h1{font-size:18px;margin:0;color:var(--ac)}
h1 span{font-size:14px;color:var(--mu);font-weight:400}
main{padding:12px;max-width:880px;margin:0 auto}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:6px;padding:12px 14px;margin-bottom:10px}
.card h2{margin:0 0 2px;font-size:17px;color:var(--ac)}
.card .when{color:var(--mu);font-size:13px;font-style:italic;margin-bottom:6px}
.card p{margin:0 0 6px}
.card p:last-child{margin-bottom:0}
</style></head><body>
<header><nav id="topbar"><a class="brand" href="index.html">Mirandel</a><a href="world.html">World Map</a><a href="markets.html">Markets</a><a href="npcs.html">NPCs</a><a class="on" href="recaps.html">Recaps</a></nav><h1>Session Recaps <span>Newest first</span></h1></header>
<main id="list"></main>
<script>
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// ---- EDIT HERE: session recaps -------------------------------------------
// Add a new session at the TOP of the list, newest first.
// [title, date, [one line per beat, three or four lines]].
// The date is optional: [title, [lines]] works too, and shows no date line.
const SESSIONS=[
["Session 1",[
"After a brief history lesson, we opened in the city of Amox, where in the bustling markets of the Warehouse District, a triton princess, Darya, made her way through the crowds. Awestruck by the technology of the land, namely an airship, she was distracted for a moment, allowing a street urchin to steal her coin purse. Quickly pursuing, she caught him, wrenching back her coin purse. Feeling hungry and slightly overwhelmed, she stepped into a nearby tavern, the Mermaid’s Tail.",
"Inside, she found a rowdy scene. A gambling game in the corner gone sour, with a large half-orc, Gruum, bullying a small human man with red hair, who you’d later learn was Orrim. From the corner, a voice called out, trying to put a stop to the fight. Silica stood up from the corner, calling out Gruum and trying to defuse the situation. However, Gruum and his two buddies had no intention of letting up their fun, and a fight broke out. Silica did some sick sickle spins, but didn’t hit anything, while Darya stepped up and knocked his shit out, causing his backup to run. Orrim, seemingly smitten with Silica, offered her a ticket to the new play in town, one that Darya also mysteriously had found a ticket to.",
"Meanwhile, an annoyed Valerius was tracking down his assistant, Edwin, with the help of his secretary, Winnie. They found him in a gambling den, where he was all in on a hand against a sketchy looking man, and Sabine, a blonde woman who was seemingly a bit ditsy. They played the hand, and the pot was split, through a little bit of antics, between Edwin and Sabine. In the pot, two tickets to the show. Sabine and Valerius went together, with Valerius taking the opportunity to scold her for taking advantage of Edwin.",
"At the play, you were all seated next to each other, and Darya was struck by the quality of person allowed in. The show began, and at the climax, during the final dramatic speech, the lead, Dorian Vance, was assassinated! The party was framed and singled out by another patron, and were captured and taken to the guardhouse at the bottom of Patriar’s Hill. Here, despite your  best efforts and several buckets of water, you could not convince the guards to free you. That is, until Commander Voss entered, a tiefling woman. She told you she didn’t think you did it, but needed a scapegoat, and while she had you, she didn’t have the ability to go after the real killer. She allowed you to “Escape”, and gave you an hour.",
"Investigating the theater, you found an arrow in the body, and a crossbow mount in the gantry. The bolt had some religious symbols of Caedes, God of Murder on it. In Dorian’s dressing room, you found a letter from Cassius Mercer, a nobleman, who Dorian was extorting for cash, threatening to expose his affair. You made your way to Valerius’s safehouse, where you decided on a plan.",
"The next morning, Sabine went to Cassius’s house to…investigate. She found that Dorian offered to let it go, for one last payment, making it seem unlikely that Cassius would kill him, She left a note for his wife, planning to expose him for the dirty cheater he was.",
"Meanwhile, Darya, Valerius, and Silica started asking around the dock taverns about some leads Edwin and Winnie had found. A shorter man had been seen trying to buy theater tickets with an odd coin. After discovering who it was, you were jumped by some thugs. Redeeming herself, Silica hit a sick double sickle sweep, stabbing 2 of them through the head simultaneously. The third got smited to shit by Darya. ",
"After this, you found Orrim on the docks and caught him, where he gave up the location he was given by his contact, someone who offered to wipe out his debt. Making your way to Candlehallow Library, you went upstairs, finding Elias, the true assassin. He was a bit cocky, and didn’t want to answer your questions, but seemed to be too tough of a fight to take at the moment, and didn’t seem to threaten you, but said his job was done. Get the four of you together. ",
"You let Voss know that you found the true killer, and she applauded your evidence, saying it tracked with what she and her team had found. It was enough to clear your name. Celebrating at the Golden Stag Tavern in the foreign quarter, Darya told the party of her quest, to collect 5 Scales, forge a great weapon, and stop a leviathan. She lamented that she could not find the first already, until the old drunk behind you turned around.",
"His drunken stupor gone, he held the scale, tossing it to Darya. He revealed himself as Caedes, God of Murder. Someone who should NOT be able to be here in any sort of physical form. To prove it, he killed a man behind you for fun, with no one noticing. He told you all that he was glad his plan worked to get you together, but that he couldn’t say more. He promised he wouldn’t have you kill anyone, least not in any weird ways, before wishing you luck and leaving the old man's body, and leaving you with more questions than answers. ",
"Just as it couldn’t get any stranger, a white-haired bard from the corner piped up, and he somehow knew 1. That the old man had been Caedes, and 2. ALL of your names. He identified himself by a few names, Midius being the main one, and said you could call him what you wanted. He said the party actually didn’t have anything to fear from Caedes for now, and to stick together, and they’d all get what they needed, but maybe not what they wanted. He said he had somewhere else to be, and departed. ",
]],
["Session 2",[
"Beginning at the Tavern, the party decided they needed some coin before going after another one of Darya’s scales, the closest of which was in Freetown. After spending a night in Valerius’ warehouse, with a heartfelt encounter with Winnie, the party headed to the adventurer’s guild. On the way, Darya took her trident and her scale into the water, saying a small prayer to Persana, and the scale dissolved, along with the trident, which took a new form in a silvery metal, able to dissolve into water, allowing her to recall it.",

"Heading to the guild, the party registered and took a job in Ferry Falls, escorting some medical supplies back to Amox. After eating some black bass, a LOT of black bass, the party went to the Mercy House to officially claim the job.",

"They were informed that bandits on the Ealdor Road had been spotted, and it was more of a precaution to hire them.You headed out, travelling to Ferry Falls after gathering some supplies and provisions.",

"After a brief travel montage, accidentally getting a caravan more stuck by breaking their already broken wheel more, and a night ambush by a small pack of wolves, you arrived in Ferry Falls, where Valerius tried to get some more coin for the job, when the Preists informed him that there was already extra money included, they just didn’t talk to Brother Alden enough to find that part out.",

"¾ of the party spent the night in a tavern near the church, while Darya decided to sleep in the river. Silica talked it up with an, at first, friendly human, who was massive, revealing he had some goliath blood in him. The conversation took an awkward turn when the man started ranting, quite aggressively, about “those damn Plinthians”. Excusing herself to sleep, the party got some rest.",

"In the morning, Darya definitely started some new folk tale horror stories in the town by emerging from the water, freaking out the townspeople. You loaded up the wagons, and headed out. After an uneventful first day, you came across the scene of an attack at the wagon you tried to help on the way out.",

"Following the tracks, you made your way into a goblin camp, and despite getting split up, managed to handle the goblins, bugbears, and ogre within, due to all of them apparently being blind to Sabine hiding behind her cape in plain sight, Silica flying around like spiderman, Valerius lighting everything on fire, and Darya using her horn to summon some elementals to aid you.",

"You found one of the travelers dead, and the other badly injured, but managed to stabilize him, rescuing him from the cave and getting him to the priests, who began to heal him as you began your final day back to Amox. "
]],
["Session 3",[
"Returning to Amox, you encountered little trouble on the road back. Arriving back in the city, people began to notice the cart of medical supplies making its way towards the Mercy House, and a crowd formed of people ready to be treated. You arrived, and Brother Alden paid you the fee, about 1600 gold, for your services. You then spent several minutes trying to figure out how to count the gold, despite it coming from a literal holy man of one of the most righteous goddesses in Mirandel.",

"You decided to get some shopping done and bought potions, cloaks, amongst other various items. When buying a Pearl of Power from the Elven Apothecary in town, Darya, finally, had someone recognize her for the royalty she was, and Elven man named Lirin. He told the party, after some convincing of his own, that Darya was indeed royalty, equivalent in Triton culture to the Emperor of Plinth, though the Triton monarchy was more blood-line than power-seizing as it is in Plinth. He looked at the map of Darya’s scales, and was shocked to find one in a city called Everlight, which he disclosed was a hidden elven city in the Everwoods south of Amox. He said the did not let outsiders in, but gave you a writ of admittance, which he claims will allow you passage into the city.",

"After this, you went to a tavern to get rooms for the night, with Darya deciding to try these things called “beds” for the night, and discovering that she did have a taste for wine. You spent some time bonding, with Valerius being friendly to Sabine, and Darya quite blatantly questioning him in the open about it. Speaking on the side, Sabine revealed she didn’t have any desire to have children or a family in a traditional sense, but flings are fun. ",

"The next day, you took the next quest from the guild, and discovered that the goliath man at the counter had a Headband of Intelligence, the tiara that sat on his head, making him smart. You took a quest to find a locket for one Lady Abernathy",

"Arriving at her estate, you took a look around, discovering that the Thieves’ Guild was likely to blame for the break-in. After some morally questionable discussion, you managed to talk her up from the original 800 gold to a whopping 2400 gold reward for finding the locket. You decided to try and pick up some leads on the guild at local bars, but didn’t have much luck…untill…",

"You, by sheer luck, happened into the bar, where a drunk patron named Amondil, was flaunting the locket to his friends. Silica managed to seduce him, and by the time he realized what was up, it was too late. He had bought the locket off of someone using funds from his job at the jewlery store on Patriar’s hill, and the party said they wouldn’t rat on him if he gave them a hefty discount if they came in, which he agreed to.",

"However, someone else had caught eye of the locket, and when you left through the alley, some bandits and thugs stopped you, and Silica tried to intimidate them into leaving. Unfortunately, the leader of the crew had a firearm, a single-shot pistol, and took the opportunity to try and blow your shit smoove off. ",

"Despite taking several shots, Silica managed to close the distance and fuck him up, and Valerius’ familiar scorched 2 of them, including the leader, with dragon’s breath, killing them, while the sole survivor fled for his life."
]],
["Session 4",[
"We found our party at the scene of a shootout, and they quickly fled the scene of the brawl, not wanting to get roped into another stint with the Amox Guard. Making their way to Patriar’s Hill, several guards inquired whether or not Silica was okay, as she had been shot 3 times. ",

"Dismissing them, you made your way to Lady Abernathy’s home, and bled all over her very expensive rug. Rather than haggle with you while you bled all over the place, she gave you an extra 400 gold to quickly leave her house so you stopped ruining her carpeting. You licked your wounds, and made your way back to Wanderer’s Rest for the night.",

"While most of you decided to retire early and attend to Silica’s wounds, Valerius did a lap of the bar, and learned from the Barmaid, Amber, that the party had been the talk of the town after the theater, bringing the supplies for the Mercy House, and allegedly, a shootout taking place in the Warehouse District. She advised caution to Valerius, as this level of notoriety was not his normal style. He thanked her, and kept looking around when he noticed that the bard in the corner looked familiar. ",

"Midius was seemingly surprised to see him, and quickly urged Valerius to tell him where he was staying that night. Valerius relented and told him, to which Midius quite annoyingly got up and left, saying he had somewhere he needed to go, but not before advising Valerius that their interests were aligned, at least for tonight. ",

"This rattled Valerius, and he informed the party, who decided to sleep in watches, though Silica suspected it was simply a ruse to share a room with Sabine. Valerius warned Amber, who took the threat seriously, and barred the doors after Valerius dispatched a messenger to tell Winnie to be careful. With that, the party retired. ",

"While the night started quietly, Valerius heard a scream during his watch, and recognized it as Winnie. Waking the others, he rushed to the courtyard behind the tavern, where Winnie was being held by someone in black robes. She identified herself as Elodan to the party, and informed them she was only there to kill Valerius, and expressed frustration with how difficult it had been to find him again.",

"After the doors locked behind you, Winnie was revealed to be an illusion, and the real Winnie was completely safe. Valerius started to rush Elodan, but she reacted impossibly fast, drawing her sword, causing a piercing noise to resonate. Darya was staggered by the sound, while the rest of you recovered. ",

"The fight seemed to start well, with you pushing her back in a retreat, until suddenly, the shadow that Silica had noticed swapped places with Elodan. She was quickly using some sort of psychic magic to harm you and learn you did not know how to revive people. She downed Valerius, and teleported away to keep distance, but when Darya healed him, she grew frustrated, switched places back, and downed him before finishing the job after learning that the final party member did not have revivify. Thinking her task complete, she smirked, bid you adieu, and dissolved into shadow. ",

"In shock, Darya was traumatized by her failure to save Valerius. Sabine and Silica, who had been trying to get the tavern doors open, were nearly knocked over and knocked over, respectively, as the tavern doors blasted open, revealing Brother Alden from the Mercy House. He ran over, praying to Selyne, Goddess of Mercy, to bring Valerius back, and did so just in the nick of time.",

"You acted quickly, gathering your things and moving to another bar, with Valerius sending Sabine to Winnie to warn her. Valerius filled the party in on his family and what had happened, with the attack and his family disappearing. You slept anxiously that night, and Silica had an odd dream. Waking, she revealed that she was greeted by Midius during her slumber, and some unseen person named Design. She said he told her a story about a dragon and a dog, and that the flute he was playing in the dream was now in her pack, with a note, “Don’t lose this”.",

"You decided to leave Amox, making for Everlight. After some shopping and asking Lirin, the Elven man, about Everlight, he expressed some awkwardness about his family in the city, giving you his sister’s name, Aelindra. He also warned you that the woods surrounding Everlight were “twisty”, and it was easy to get lost.",

"Heading out on some horses, you traveled to Ferry Falls without surprise. Well, without issue, as when Valerius summoned his familiar as he had in the past, it screamed. Valerius recognized the voice as Alaric, the First Steward of the House of Elenvale, who he had seen get killed during the attack. After some calming, Alaric kept his duty to serve Valerius, albeit in an awkward form now.",

"Traveling along, a man at a Ferry Shack was playing a banjo. He asked you to get his ferry from the other shore, offering them 400 gold. The party reluctantly agreed due to the simplicity of the quest. However, when you got there, Darya was attacked by a Water Weird. Thanks to a branding smite from Silica, you all managed to spot the creature in the water, and kill it without too much issue. You found some loot, potions, and a tome for Valerius, and continued along to Miller’s Crossroad."
]]
];
$('list').innerHTML=SESSIONS.map(s=>{const lines=Array.isArray(s[1])?s[1]:s[2],date=Array.isArray(s[1])?'':s[1];
return `<div class=card><h2>${esc(s[0])}</h2>${date?`<div class=when>${esc(date)}</div>`:''}${lines.map(l=>`<p>${esc(l)}</p>`).join('')}</div>`}).join('');
</script></body></html>
