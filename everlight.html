<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>City of Everlight – Interactive Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1a17;--panel:#f4ead5;--ink:#2b2216;--accent:#7a4b1e;--rule:#c9b48a;--route:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:#2a251c;--ink:#efe4cc;--accent:#e0b06a;--rule:#4a4130;--route:#ff6b57}}
:root[data-theme="dark"]{--panel:#2a251c;--ink:#efe4cc;--accent:#e0b06a;--rule:#4a4130;--route:#ff6b57}
html,body{height:100%;margin:0;background:var(--bg);font-family:'Alegreya',Georgia,"Times New Roman",serif;overflow:hidden;color:var(--ink)}
/* EDIT: map backdrop, trial: forest photo behind the map. Remove the url() to go back to plain dark. */
#view{position:absolute;top:calc(42px + env(safe-area-inset-top,0px));right:0;bottom:0;left:0;touch-action:none;cursor:grab;overflow:hidden;background:linear-gradient(rgba(20,18,14,.5),rgba(20,18,14,.6)),#1b1a17 url(assets/bg-forest.jpg) center/cover}
#view.plot{cursor:crosshair}
#world{position:absolute;left:0;top:0;transform-origin:0 0;--inv:1}
#world img{display:block;user-select:none;-webkit-user-drag:none}
#route{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.pin{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:3px solid #ffd36b;box-shadow:0 0 0 1.5px #2b2216,0 0 7px #000;cursor:pointer;transform:scale(var(--inv));box-sizing:border-box}
.pin.region{width:18px;height:18px;margin:-9px 0 0 -9px;border:2px dashed #fff;background:rgba(255,211,107,.55)}
.pin:hover,.pin.on{background:rgba(255,211,107,.45);z-index:5}
.pin::after{content:attr(data-n);position:absolute;left:50%;bottom:125%;transform:translateX(-50%);background:var(--panel);color:var(--ink);padding:2px 7px;border-radius:4px;font-size:13px;white-space:nowrap;opacity:0;pointer-events:none;border:1px solid var(--rule)}
.pin:hover::after{opacity:1}
.wp{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:var(--route);color:#fff;font:700 11px/20px 'Alegreya',Georgia,serif;text-align:center;border:2px solid #fff;box-shadow:0 0 4px #000;transform:scale(var(--inv));pointer-events:none;box-sizing:content-box}
.ui{position:absolute;background:var(--panel);border:1px solid var(--rule);border-radius:8px;box-shadow:0 3px 14px rgba(0,0,0,.45)}
#tools{left:12px;top:calc(54px + env(safe-area-inset-top,0px));display:flex;gap:6px;padding:6px}
button{font:inherit;font-size:14px;background:transparent;color:var(--ink);border:1px solid var(--rule);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.active{background:var(--accent);color:var(--panel);border-color:var(--accent)}
#rp{left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:300px;padding:10px 12px;display:none;font-size:14px}
#rp h3{margin:0 0 4px;font-size:16px;color:var(--accent)}
#rp p{margin:4px 0;font-size:13px;opacity:.85}
#rp table{width:100%;border-collapse:collapse;margin:6px 0}
#rp td{padding:3px 0;border-top:1px solid var(--rule)}
#rp td:last-child{text-align:right;font-weight:700}
#rp .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#rp input{width:70px;font:inherit;background:transparent;color:var(--ink);border:1px solid var(--rule);border-radius:4px;padding:2px 4px}
#cards{position:absolute;right:12px;top:calc(54px + env(safe-area-inset-top,0px));width:320px;max-height:calc(100% - 66px);overflow:auto;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.card{pointer-events:auto;position:relative;padding:12px 14px}
.card h2{margin:0 26px 0 0;font-size:19px;color:var(--accent)}
.card small{display:block;margin:0 0 6px;font-style:italic;opacity:.7}
.card p{margin:0;font-size:14.5px;line-height:1.5}
.card .x{position:absolute;right:8px;top:8px;padding:0 8px;font-size:18px;line-height:24px}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom,0px));font-size:12px;color:#d8cba8;background:rgba(0,0,0,.45);padding:3px 10px;border-radius:10px;pointer-events:none;white-space:nowrap}
@media(max-width:640px){#cards{left:8px;right:8px;top:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px));width:auto;max-height:45%}#rp{left:8px;right:8px;width:auto;bottom:auto;top:calc(102px + env(safe-area-inset-top,0px))}#hint{display:none}}

#topbar{position:absolute;top:0;left:0;right:0;height:calc(42px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:2px;padding-left:10px;padding-right:10px;background:var(--panel);border-bottom:1px solid var(--rule);font-size:14px;box-sizing:border-box;overflow-x:auto}
#topbar a{color:var(--ink);text-decoration:none;padding:4px 10px;border-radius:6px;white-space:nowrap}
#topbar a:hover{text-decoration:underline}
#topbar a.on{background:var(--accent);color:var(--panel)}
#topbar .brand{font-weight:700;color:var(--accent);font-size:16px}
#topbar .brand.on{color:var(--panel)}
</style></head><body>

<script>
// ---- EDIT HERE: settings -------------------------------------------------
var MAP_WIDTH_MILES=1;             // real-world width of the map in miles (Ben: about a mile across; the art is "not to scale", so this is approximate); players can also change it in the route panel
var WORLD_URL="world.html";        // link back to the world map ("" hides the button)
var DAY_HOURS=8;                   // travel hours per day (5.5e: 8 hours)
var MODES=[                        // miles per hour; D&D 5.5e pace: slow 2, normal 3, fast 4 mph; mounts = speed ft ÷ 10
 ["Walking – slow",2],["Walking – normal",3],["Walking – fast",4],
 ["Wagon",2],["Carriage",4],["Horse (riding)",6]];
// ---- Locations: [name, x, y, kind, text] (x,y in pixels on the 1179×884 map) -------
var PLACES=[
["The Heartwood",593,440,"Landmark","The oldest and tallest tree in Everlight, standing at the center of the city. The Lady's hall is built into its boughs. Lord Merethil keeps the great tree and tends the groves around it."],
["The Mirror Pool",745,480,"Landmark","In a clearing near the Heartwood, a still pool so clear that the stars are visible in it even by day. It is the most sacred place for the elves."],
["The Groves",595,111,"District","The groves around the city of Everlight, tended by Lord Merethil, the Lady's consort, and his caretakers. The trees are sunwood, and their leaves are gold in every season. The light under the trees is always golden, as if it were late afternoon."],
["Hall of Names",963,200,"Landmark","Elder Miriel, the lorekeeper of Everlight, keeps the city's histories."],
["The Singing Boughs",371,320,"Landmark","At dusk, elves sing here. The sound echoes across the groves, and it is beautiful.."],
["The Parting Gardens",118,367,"Landmark","Guests in Everlight are given gifts when they leave. The Lady gives each guest something small and useful, chosen for that person. It is an old custom, and the elves do not explain it."],
["The Guest Boughs",975,742,"Landmark","Platforms set aside for incredibly rare guests of the city. Those who are admitted are escorted in, and the forest opens for them. Guests are asked not to speak of Everlight after they leave."]
];
// ---- Map engine ---------------------------------------------------------
var $=function(i){return document.getElementById(i)};
var BX=1179,BY=884,img=$("map"),W=1179,H=884;
var view=$("view"),world=$("world"),cards=$("cards");
var T={s:1,x:0,y:0},minS=.1,maxS=4,plot=false,pts=[];
try{var sv=localStorage.getItem("everlightMW");if(sv)MAP_WIDTH_MILES=+sv||MAP_WIDTH_MILES}catch(e){}
img.width=W;img.height=H;$("route").setAttribute("width",W);$("route").setAttribute("height",H);
function apply(){world.style.transform="translate("+T.x+"px,"+T.y+"px) scale("+T.s+")";world.style.setProperty("--inv",1/T.s)}
function fit(){var vw=view.clientWidth,vh=view.clientHeight;minS=Math.min(vw/W,vh/H);T.s=minS;T.x=(vw-W*T.s)/2;T.y=(vh-H*T.s)/2;apply()}
function zoomAt(cx,cy,f){var n=Math.max(minS,Math.min(maxS,T.s*f)),k=n/T.s;T.x=cx-(cx-T.x)*k;T.y=cy-(cy-T.y)*k;T.s=n;apply()}
function toMap(cx,cy){var r=view.getBoundingClientRect();return[(cx-r.left-T.x)/T.s,(cy-r.top-T.y)/T.s]}
window.addEventListener("resize",function(){var w=T.s===minS;minS=Math.min(view.clientWidth/W,view.clientHeight/H);if(w)fit();else zoomAt(0,0,1)});
// pins
PLACES.forEach(function(p,i){var d=document.createElement("div");d.className="pin"+(p[3]=="District"?" region":"");d.dataset.n=p[0];d.dataset.i=i;d.style.left=p[1]*W/BX+"px";d.style.top=p[2]*H/BY+"px";d.setAttribute("role","button");d.setAttribute("aria-label",p[0]);world.appendChild(d)});
world.addEventListener("click",function(e){var d=e.target.closest(".pin");if(!d)return;e.stopPropagation();var p=PLACES[+d.dataset.i];if(plot){addPt(parseFloat(d.style.left),parseFloat(d.style.top))}else showCard(+d.dataset.i)});
// pan / pinch / click-to-plot
var ptr={},moved=false,last=0,startXY=null;
view.addEventListener("pointerdown",function(e){if(e.target.closest(".ui,#cards"))return;ptr[e.pointerId]={x:e.clientX,y:e.clientY};if(Object.keys(ptr).length===1){moved=false;startXY=[e.clientX,e.clientY]}last=0;view.style.cursor=plot?"crosshair":"grabbing"});
view.addEventListener("pointermove",function(e){var p=ptr[e.pointerId];if(!p)return;var ids=Object.keys(ptr);
 if(ids.length===1){var dx=e.clientX-p.x,dy=e.clientY-p.y;if(!moved&&Math.hypot(e.clientX-startXY[0],e.clientY-startXY[1])>6){moved=true;try{view.setPointerCapture(e.pointerId)}catch(x){}}if(moved){T.x+=dx;T.y+=dy;apply()}p.x=e.clientX;p.y=e.clientY}
 else if(ids.length===2){moved=true;var o=ptr[ids.find(function(k){return k!=e.pointerId})];var d0=Math.hypot(p.x-o.x,p.y-o.y);p.x=e.clientX;p.y=e.clientY;var d1=Math.hypot(p.x-o.x,p.y-o.y);if(d0>0){var r=view.getBoundingClientRect();zoomAt((p.x+o.x)/2-r.left,(p.y+o.y)/2-r.top,d1/d0)}}});
function up(e){if(!ptr[e.pointerId])return;var single=Object.keys(ptr).length===1;delete ptr[e.pointerId];view.style.cursor="";
 if(single&&!moved&&plot&&e.type==="pointerup"&&!e.target.closest(".pin")){var m=toMap(e.clientX,e.clientY);if(m[0]>=0&&m[1]>=0&&m[0]<=W&&m[1]<=H)addPt(m[0],m[1])}}
view.addEventListener("pointerup",up);view.addEventListener("pointercancel",up);
view.addEventListener("wheel",function(e){e.preventDefault();var r=view.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(-e.deltaY*(e.ctrlKey?.01:.0017)))},{passive:false});
// info cards
function showCard(i){var ex=cards.querySelector('[data-i="'+i+'"]');if(ex)return;var p=PLACES[i],c=document.createElement("div");c.className="card ui";c.dataset.i=i;
 var h=document.createElement("h2");h.textContent=p[0];var s=document.createElement("small");s.textContent=p[3];var t=document.createElement("p");t.textContent=p[4];
 var x=document.createElement("button");x.className="x";x.textContent="×";x.setAttribute("aria-label","Close");x.onclick=function(){c.remove();mark()};
 c.append(h,s,t,x);cards.appendChild(c);while(cards.children.length>3)cards.firstChild.remove();mark()}
function mark(){var on={};[].forEach.call(cards.children,function(c){on[c.dataset.i]=1});[].forEach.call(world.querySelectorAll(".pin"),function(d){d.classList.toggle("on",!!on[d.dataset.i])})}
// route plotting
function addPt(x,y){pts.push([x,y]);drawRoute()}
function fmt(h){if(h<1)return Math.max(1,Math.round(h*60))+" min";var d=Math.floor(h/DAY_HOURS+1e-9),r=Math.round((h-d*DAY_HOURS)*10)/10;if(r>=DAY_HOURS){d++;r=0}return(d?d+" d ":"")+(r?r+" h":"").trim()}
function dist(mi){return mi<0.5?(Math.round(mi*528)*10).toLocaleString()+" feet":(Math.round(mi*100)/100)+" miles"}
function drawRoute(){[].forEach.call(world.querySelectorAll(".wp"),function(n){n.remove()});
 $("line").setAttribute("points",pts.map(function(p){return p[0]+","+p[1]}).join(" "));
 pts.forEach(function(p,i){var w=document.createElement("div");w.className="wp";w.textContent=i+1;w.style.left=p[0]+"px";w.style.top=p[1]+"px";world.appendChild(w)});
 var px=0;for(var i=1;i<pts.length;i++)px+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
 var mi=px/W*MAP_WIDTH_MILES,html="";
 if(pts.length<2){html="<p>Add at least two points to measure a route.</p>"}
 else{html="<p><b>"+dist(mi)+"</b> over "+(pts.length-1)+" leg"+(pts.length>2?"s":"")+" (straight lines)</p><table>"+MODES.map(function(m){return"<tr><td>"+m[0]+" <span style='opacity:.6'>("+m[1]+" mph)</span></td><td>"+fmt(mi/m[1])+"</td></tr>"}).join("")+"</table><p>Assumes "+DAY_HOURS+" travel hours per day.</p>"}
 $("rres").innerHTML=html;setPlot(plot||pts.length>0)}
function setPlot(on){plot=on;view.classList.toggle("plot",on);$("bPlot").classList.toggle("active",on);$("rp").style.display=(on||pts.length)?"block":"none"}
function clearRoute(){pts=[];drawRoute();setPlot(false)}
$("bPlot").onclick=function(){if(plot&&!pts.length)setPlot(false);else if(plot)clearRoute();else{setPlot(true);drawRoute()}};
$("bUndo").onclick=function(){pts.pop();drawRoute()};$("bClear").onclick=clearRoute;
$("bIn").onclick=function(){zoomAt(view.clientWidth/2,view.clientHeight/2,1.4)};$("bOut").onclick=function(){zoomAt(view.clientWidth/2,view.clientHeight/2,1/1.4)};$("bFit").onclick=fit;
$("mw").value=MAP_WIDTH_MILES;$("mw").onchange=function(){var v=+this.value;if(v>0){MAP_WIDTH_MILES=v;try{localStorage.setItem("everlightMW",v)}catch(e){}drawRoute()}};
document.addEventListener("keydown",function(e){if(e.key==="Escape"){clearRoute()}});
if(WORLD_URL){var a=$("bWorld");a.href=WORLD_URL;a.style.display="inline-block"}
fit();
</script></body></html>
